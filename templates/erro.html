{% extends "auth_base.html" %}
{% from "_icons.html" import icone %}

{% block titulo %}{{ codigo }} · {{ titulo }}{% endblock %}

{% block conteudo %}
<div class="error-card">
  <span class="error-card__code">{{ codigo }}</span>
  <span class="error-card__icon">{{ icone('alert') }}</span>
  <h1>{{ titulo }}</h1>
  <p>{{ mensagem }}</p>
  <div class="error-card__actions">
    <a href="{{ url_for('web.dashboard') }}" class="button button--primary">Ir para o início</a>
    <button type="button" class="button button--ghost" onclick="history.back()">Voltar</button>
  </div>
</div>
{% endblock %}
